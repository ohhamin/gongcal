# Keep Gradle memory small enough for lightweight CI/agent runners.
org.gradle.jvmargs=-Xmx512m -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=96m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=1
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
