name: Android APK

on:
  workflow_dispatch:
    inputs:
      web_url:
        description: 'OURCAL web URL loaded by the WebView shell'
        required: false
        default: 'https://ourcal.vercel.app'
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: >-
          flutter build apk --debug
          --dart-define=OURCAL_WEB_URL=${{ github.event.inputs.web_url || 'https://ourcal.vercel.app' }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ourcal-debug-apk
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
